[project]
name = "pakka"
version = "0.1.0"
description = "Pakka Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "sqlmodel>=0.0.18",
    "httpx>=0.27.0",
    "rapidfuzz>=3.9.1",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
    "PyYAML>=6.0.1",
    "slowapi>=0.1.9",
    "uvicorn>=0.29.0",
    "beautifulsoup4>=4.12.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "reportlab>=4.2.0"
]
